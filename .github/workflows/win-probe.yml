name: Windows fresh-machine probe (temporary)
on:
  push:
    branches: [claude/project-thread-6leh4b]
    paths: ['.github/win-probe/**', '.github/workflows/win-probe.yml', 'install.*']
jobs:
  clean-container:
    name: Release installer in a clean Server Core container
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Run in mcr.microsoft.com/windows/servercore:ltsc2022
        shell: pwsh
        run: |
          docker pull mcr.microsoft.com/windows/servercore:ltsc2022
          foreach ($d in 'avicap32.dll','msvfw32.dll') { Copy-Item "$env:WINDIR\System32\$d" .github\win-probe\ -ErrorAction Continue }
          docker run --rm -v "${{ github.workspace }}\.github\win-probe:C:\probe" -v "${{ github.workspace }}\tests\fixtures:C:\fix" `
            mcr.microsoft.com/windows/servercore:ltsc2022 powershell -NoProfile -ExecutionPolicy Bypass -File C:\probe\clean.ps1

  vlc-e2e:
    name: Release installer + real VLC (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v4
      - name: Machine
        shell: pwsh
        run: |
          "arch: $env:PROCESSOR_ARCHITECTURE"
          foreach ($c in 'python','py','uv','ffmpeg','vlc') { "$c on PATH: $([bool](Get-Command $c -ErrorAction SilentlyContinue))" }
      - name: Install VLC 3.0.21 (win64)
        shell: pwsh
        run: |
          $u = 'https://download.videolan.org/pub/videolan/vlc/3.0.21/win64/vlc-3.0.21-win64.zip'
          Invoke-WebRequest -UseBasicParsing $u -OutFile vlc.zip
          (Get-Item vlc.zip).Length
          Expand-Archive vlc.zip "$env:RUNNER_TEMP\vlczip"
          New-Item -ItemType Directory -Force "$env:ProgramFiles\VideoLAN" | Out-Null
          Move-Item "$env:RUNNER_TEMP\vlczip\vlc-3.0.21" "$env:ProgramFiles\VideoLAN\VLC"
          Get-Item "$env:ProgramFiles\VideoLAN\VLC\vlc.exe"
      - name: Released install.cmd (as a user double-clicking it)
        shell: powershell
        run: .\.github\win-probe\install-release.ps1
      - name: Imports after the released install
        if: always()
        shell: pwsh
        run: .\.github\win-probe\imports.ps1
      - name: Retry with x64 Python (ARM only)
        if: always() && matrix.os == 'windows-11-arm'
        shell: pwsh
        env:
          VLC_SUBSYNC_PYTHON: cpython-3.12-windows-x86_64-none
        run: |
          Invoke-WebRequest -UseBasicParsing https://github.com/sergimn/VLCSubtitleSync/releases/download/v1.0.0/install.ps1 -OutFile "$env:RUNNER_TEMP\install.ps1"
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\install.ps1"
          .\.github\win-probe\imports.ps1
      - name: CLI sync on a fixture
        if: always()
        shell: pwsh
        run: .\.github\win-probe\sync-check.ps1 -Fix "$env:GITHUB_WORKSPACE\tests\fixtures"
      - name: VLC end-to-end
        if: always()
        shell: pwsh
        run: .\.github\win-probe\e2e.ps1 -Fix "$env:GITHUB_WORKSPACE\tests\fixtures"
