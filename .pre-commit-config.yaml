# See https://pre-commit.com. Install with: uvx pre-commit install
exclude: ^tests/fixtures/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: mixed-line-ending
        args: [--fix=no]
  # Renovate updates this rev; the lint job in .github/workflows/ci.yml pins the same
  # ruff version (RUFF_VERSION) and is bumped together with it. Keep both in sync.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253  # frozen: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229  # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck
  # luacheck via luarocks is not available everywhere; run it when installed
  # (CI always runs it in the lint job).
  - repo: local
    hooks:
      - id: luacheck
        name: luacheck (if installed)
        language: system
        types: [lua]
        entry: sh -c 'if command -v luacheck >/dev/null; then luacheck "$@"; else echo "luacheck not installed, skipping"; fi' --
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint
