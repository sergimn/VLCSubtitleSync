[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vlc-subsync"
version = "1.1.1"
description = "Automatically sync VLC subtitles to the selected audio track using Whisper"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "faster-whisper>=1.1",
  "av>=12",
  "numpy>=1.24",
  "pysubs2>=1.7",
  "platformdirs>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "lupa>=2.0", "pre-commit>=4"]
fixtures = ["piper-tts>=1.3"]

[project.scripts]
vlc-subsync = "vlcsubsync.cli:main"

[project.gui-scripts]
vlc-subsync-daemon = "vlcsubsync.cli:daemon_main"

[tool.hatch.build.targets.sdist]
exclude = ["tests/fixtures", ".github", ".cache"]

[tool.hatch.build.targets.wheel]
packages = ["src/vlcsubsync"]

# uv.lock pins every dependency (direct and indirect) for CI and the released installers;
# the `dependencies` ranges stay loose for anyone installing the package another way.
# Renovate moves the pins (see renovate.json), and `uv lock` keeps them consistent.
[tool.uv]
# Lock only releases at least 14 days old, like Renovate's minimumReleaseAge.
# Keep this exact spelling: uv.lock stores it, and "2 weeks" would count as a change.
exclude-newer = "14 days"
# Every pin must have a wheel for each platform the installers support. Windows on ARM
# runs x64 Python (no ARM64 ctranslate2 wheels), so it is covered by the AMD64 entry and
# must not be listed itself.
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
# Relative exclude-newer values need a recent uv to read the lock the same way.
required-version = ">=0.11.8"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs Whisper model download / real decoding", "vlc: needs a real VLC binary"]
addopts = "-m 'not slow and not vlc'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
