# See https://pre-commit.com. Install with: uvx pre-commit install
exclude: ^tests/fixtures/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: mixed-line-ending
        args: [--fix=no]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
  # luacheck via luarocks is not available everywhere; run it when installed
  # (CI always runs it in the lint job).
  - repo: local
    hooks:
      - id: luacheck
        name: luacheck (if installed)
        language: system
        types: [lua]
        entry: sh -c 'if command -v luacheck >/dev/null; then luacheck "$@"; else echo "luacheck not installed, skipping"; fi' --
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
