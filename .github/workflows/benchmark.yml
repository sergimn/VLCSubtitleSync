name: Benchmark

# Sync accuracy on the committed TTS fixtures (scripts/bench_fixtures.py).
# main: results in the step summary + the `benchmark-results` artifact (the PR baseline).
# PRs: the same run, compared with the latest main artifact in a sticky PR comment.
# Informational only: a worse result never fails the job.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  bench:
    name: Sync accuracy benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # download the baseline artifact from another run
      pull-requests: write # sticky comment
    env:
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      GH_TOKEN: ${{ github.token }}
      BENCH_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Cache Whisper models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-whisper-tiny.en-base.en-base-v1
      - name: Download models
        run: python -m vlcsubsync.cli download-models tiny.en base.en base

      - name: Run benchmark
        # on main a broken run must show (it is the baseline); on PRs it is informational
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: python scripts/bench_fixtures.py run --out bench
      - name: Publish summary
        if: hashFiles('bench/results.json') != ''
        run: cat bench/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: hashFiles('bench/results.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: |
            bench/results.json
            bench/summary.md
            bench/srt/
          retention-days: 90

      - name: Fetch main baseline
        continue-on-error: true
        id: baseline
        if: github.event_name == 'pull_request' && hashFiles('bench/results.json') != ''
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow benchmark.yml \
            --branch main --event push --status success --limit 1 \
            --json databaseId,url --jq '.[0] // empty | "\(.databaseId) \(.url)"' || true)
          if [ -z "$run" ]; then
            echo "No successful benchmark run on main yet."
            exit 0
          fi
          read -r id url <<< "$run"
          if gh run download "$id" --repo "$GITHUB_REPOSITORY" -n benchmark-results -D baseline; then
            echo "url=$url" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::could not download the baseline artifact of run $id"
          fi
      - name: Compare with main
        continue-on-error: true
        if: github.event_name == 'pull_request' && hashFiles('bench/results.json') != ''
        env:
          BASE_URL: ${{ steps.baseline.outputs.url }}
        run: |
          python scripts/bench_fixtures.py compare bench/results.json \
            --base baseline/results.json --base-url "$BASE_URL" > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on PR
        # fork PRs get a read-only token; their comparison is in the step summary
        continue-on-error: true
        if: >-
          github.event_name == 'pull_request' && hashFiles('comment.md') != '' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]")
                      | select(.body | contains("<!-- vlcsubsync-benchmark -->")) | .id')
          id=${ids%%$'\n'*}
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md
          fi
