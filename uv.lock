    { name = "av" },
    { name = "faster-whisper" },
    { name = "numpy" },
    { name = "platformdirs" },
    { name = "pysubs2" },
]

[package.optional-dependencies]
dev = [
    { name = "lupa" },
    { name = "pre-commit" },
    { name = "pytest" },
    { name = "ruff" },
]
fixtures = [
    { name = "piper-tts" },
]

[package.metadata]
requires-dist = [
    { name = "av", specifier = ">=12" },
    { name = "faster-whisper", specifier = ">=1.1" },
    { name = "lupa", marker = "extra == 'dev'", specifier = ">=2.0" },
    { name = "numpy", specifier = ">=1.24" },
    { name = "piper-tts", marker = "extra == 'fixtures'", specifier = ">=1.3" },
    { name = "platformdirs", specifier = ">=4" },
    { name = "pre-commit", marker = "extra == 'dev'", specifier = ">=4" },
    { name = "pysubs2", specifier = ">=1.7" },
    { name = "pytest", marker = "extra == 'dev'", specifier = ">=8" },
    { name = "ruff", marker = "extra == 'dev'", specifier = ">=0.6" },
]
provides-extras = ["dev", "fixtures"]
